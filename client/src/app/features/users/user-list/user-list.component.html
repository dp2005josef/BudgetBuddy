<div class="page-container">
  <div class="page-header">
    <h1>User Management</h1>
    <button mat-raised-button color="primary" routerLink="/users/new">
      <mat-icon>add</mat-icon>
      New User
    </button>
  </div>

  <mat-card class="users-card">
    <mat-card-content>
      <div class="filter-container">
        <mat-form-field appearance="outline" class="filter-field">
          <mat-label>Filter</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Search users...">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
      </div>

      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="error" class="error-container">
        <mat-icon>error_outline</mat-icon>
        <p>Failed to load users</p>
        <button mat-raised-button color="primary" (click)="loadUsers()">Retry</button>
      </div>

      <div *ngIf="!isLoading && !error" class="table-container">
        <div *ngIf="dataSource.data.length === 0" class="empty-list">
          <mat-icon>people</mat-icon>
          <p>No users found</p>
          <button mat-raised-button color="primary" routerLink="/users/new">Add User</button>
        </div>

        <table mat-table [dataSource]="dataSource" matSort *ngIf="dataSource.data.length > 0" class="users-table">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let user">{{ user.name }}</td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <!-- Roles Column -->
          <ng-container matColumnDef="roles">
            <th mat-header-cell *matHeaderCellDef>Roles</th>
            <td mat-cell *matCellDef="let user">
              <div class="roles-container">
                <ng-container *ngIf="user.roles && user.roles.length > 0; else noRoles">
                  <mat-chip-listbox>
                    <mat-chip *ngFor="let role of user.roles">{{ role }}</mat-chip>
                  </mat-chip-listbox>
                </ng-container>
                <ng-template #noRoles>
                  <span class="no-roles">No roles</span>
                </ng-template>
              </div>
            </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="isActive">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
            <td mat-cell *matCellDef="let user">
              <span class="status-badge" [ngClass]="user.isActive ? 'active-badge' : 'inactive-badge'">
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
          </ng-container>

          <!-- Created Date Column -->
          <ng-container matColumnDef="createdAt">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let user">{{ user.createdAt | date }}</td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button color="primary" (click)="navigateToEdit(user.id)" matTooltip="Edit User">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(user, $event)" matTooltip="Delete User">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="user-row"></tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" showFirstLastButtons *ngIf="dataSource.data.length > 0"></mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<style>
  .page-container {
    padding: 24px;
  }

  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0;
  }

  .users-card {
    padding: 16px;
  }

  .filter-container {
    margin-bottom: 16px;
  }

  .filter-field {
    width: 100%;
    max-width: 400px;
  }

  .loading-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 300px;
  }

  .error-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 300px;
    text-align: center;
  }

  .error-container mat-icon {
    font-size: 48px;
    height: 48px;
    width: 48px;
    color: #f44336;
    margin-bottom: 16px;
  }

  .empty-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 0;
    color: #757575;
  }

  .empty-list mat-icon {
    font-size: 48px;
    height: 48px;
    width: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .table-container {
    overflow-x: auto;
  }

  .users-table {
    width: 100%;
  }

  .user-row {
    transition: background-color 0.2s;
  }

  .user-row:hover {
    background-color: rgba(0, 0, 0, 0.04);
  }

  .status-badge {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .active-badge {
    background-color: #e8f5e9;
    color: #2e7d32;
  }

  .inactive-badge {
    background-color: #eeeeee;
    color: #757575;
  }

  .roles-container {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .no-roles {
    color: #757575;
    font-style: italic;
  }

  .mat-mdc-chip-set {
    display: flex;
    flex-wrap: wrap;
    min-height: 32px;
  }

  .mat-mdc-chip {
    font-size: 12px;
    height: 24px;
  }
</style>
