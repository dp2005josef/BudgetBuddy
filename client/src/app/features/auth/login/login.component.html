<div class="login-container">
  <div class="login-card-wrapper">
    <div class="logo-container">
      <img src="assets/logo.png" alt="ETL Manager Logo" class="logo">
    </div>
    
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>ETL Manager</mat-card-title>
        <mat-card-subtitle>Faça login para acessar o sistema</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <div class="form-fields">
            <mat-form-field appearance="outline">
              <mat-label>Email</mat-label>
              <input 
                matInput 
                formControlName="email" 
                type="email" 
                autocomplete="email"
                required>
              <mat-icon matSuffix>email</mat-icon>
              <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
                Email é obrigatório
              </mat-error>
              <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                Insira um email válido
              </mat-error>
            </mat-form-field>
            
            <mat-form-field appearance="outline">
              <mat-label>Senha</mat-label>
              <input 
                matInput 
                formControlName="password" 
                [type]="hidePassword ? 'password' : 'text'" 
                autocomplete="current-password"
                required>
              <button 
                mat-icon-button 
                matSuffix 
                type="button"
                (click)="hidePassword = !hidePassword" 
                [attr.aria-label]="'Mostrar senha'"
                [attr.aria-pressed]="!hidePassword">
                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                Senha é obrigatória
              </mat-error>
            </mat-form-field>
            
            <div *ngIf="errorMessage" class="error-message">
              <mat-icon>error_outline</mat-icon>
              <span>{{errorMessage}}</span>
            </div>
            
            <button 
              mat-raised-button 
              color="primary" 
              type="submit" 
              class="login-button"
              [disabled]="loginForm.invalid || isLoading">
              <mat-spinner *ngIf="isLoading" diameter="24" class="spinner"></mat-spinner>
              <span *ngIf="!isLoading">Entrar</span>
            </button>
          </div>
        </form>
      </mat-card-content>
      
      <mat-card-footer class="login-footer">
        <p>&copy; 2025 ETL Manager. Todos os direitos reservados.</p>
      </mat-card-footer>
    </mat-card>
  </div>
</div>
