<div class="container">
  <mat-card appearance="outlined" class="change-password-card">
    <mat-card-header>
      <mat-card-title>Alterar Senha</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha atual</mat-label>
          <input matInput [type]="hideCurrentPassword ? 'password' : 'text'" formControlName="currentPassword">
          <button type="button" mat-icon-button matSuffix (click)="hideCurrentPassword = !hideCurrentPassword" tabindex="-1">
            <mat-icon>{{hideCurrentPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
            Senha atual é obrigatória
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nova senha</mat-label>
          <input matInput [type]="hideNewPassword ? 'password' : 'text'" formControlName="newPassword">
          <button type="button" mat-icon-button matSuffix (click)="hideNewPassword = !hideNewPassword" tabindex="-1">
            <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
            Nova senha é obrigatória
          </mat-error>
          <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
            A senha deve ter pelo menos 6 caracteres
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar nova senha</mat-label>
          <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword">
          <button type="button" mat-icon-button matSuffix (click)="hideConfirmPassword = !hideConfirmPassword" tabindex="-1">
            <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('required')">
            Confirmação de senha é obrigatória
          </mat-error>
          <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('passwordMismatch')">
            As senhas não coincidem
          </mat-error>
        </mat-form-field>

        <div class="form-actions">
          <button mat-button routerLink="/dashboard">Cancelar</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="changePasswordForm.invalid || isLoading">
            <mat-spinner diameter="20" *ngIf="isLoading" class="button-spinner"></mat-spinner>
            <span *ngIf="!isLoading">Alterar senha</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
