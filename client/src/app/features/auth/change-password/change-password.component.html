<div class="container">
  <div class="change-password-header">
    <h1>Alterar Senha</h1>
  </div>

  <mat-card appearance="outlined" class="form-card">
    <mat-card-content>
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        <div class="form-fields">
          <mat-form-field appearance="outline">
            <mat-label>Senha Atual</mat-label>
            <input 
              matInput 
              formControlName="currentPassword" 
              [type]="hideCurrentPassword ? 'password' : 'text'" 
              autocomplete="current-password"
              required>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hideCurrentPassword = !hideCurrentPassword" 
              [attr.aria-label]="'Mostrar senha atual'"
              [attr.aria-pressed]="!hideCurrentPassword">
              <mat-icon>{{hideCurrentPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
              Senha atual é obrigatória
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Nova Senha</mat-label>
            <input 
              matInput 
              formControlName="newPassword" 
              [type]="hideNewPassword ? 'password' : 'text'" 
              autocomplete="new-password"
              required>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hideNewPassword = !hideNewPassword" 
              [attr.aria-label]="'Mostrar nova senha'"
              [attr.aria-pressed]="!hideNewPassword">
              <mat-icon>{{hideNewPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
              Nova senha é obrigatória
            </mat-error>
            <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
              Nova senha deve ter no mínimo 6 caracteres
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="outline">
            <mat-label>Confirmar Nova Senha</mat-label>
            <input 
              matInput 
              formControlName="confirmPassword" 
              [type]="hideConfirmPassword ? 'password' : 'text'" 
              autocomplete="new-password"
              required>
            <button 
              mat-icon-button 
              matSuffix 
              type="button"
              (click)="hideConfirmPassword = !hideConfirmPassword" 
              [attr.aria-label]="'Mostrar confirmação de nova senha'"
              [attr.aria-pressed]="!hideConfirmPassword">
              <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('required')">
              Confirmação de senha é obrigatória
            </mat-error>
            <mat-error *ngIf="changePasswordForm.get('confirmPassword')?.hasError('mismatch')">
              As senhas não coincidem
            </mat-error>
          </mat-form-field>
          
          <div class="form-actions">
            <button 
              mat-raised-button 
              type="button" 
              (click)="onCancel()" 
              [disabled]="isLoading">
              Cancelar
            </button>
            <button 
              mat-raised-button 
              color="primary" 
              type="submit" 
              [disabled]="changePasswordForm.invalid || isLoading">
              <mat-spinner *ngIf="isLoading" diameter="24" class="spinner"></mat-spinner>
              <span *ngIf="!isLoading">Alterar Senha</span>
            </button>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
