<mat-toolbar color="primary">
  <button mat-icon-button (click)="sidenav.toggle()" *ngIf="isAuthenticated$ | async">
    <mat-icon>menu</mat-icon>
  </button>
  <span class="logo">ETL Manager</span>
  <span class="spacer"></span>
  <ng-container *ngIf="isAuthenticated$ | async">
    <span class="username">{{ (currentUser$ | async)?.name }}</span>
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="User menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="goToProfile()">
        <mat-icon>settings</mat-icon>
        <span>Alterar Senha</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Sair</span>
      </button>
    </mat-menu>
  </ng-container>
</mat-toolbar>
