<mat-sidenav-container class="sidenav-container">
  <!-- Sidenav (menu lateral) -->
  <mat-sidenav #sidenav mode="over" class="sidenav" [fixedInViewport]="true">
    <div class="sidenav-header">
      <div class="logo-container">
        <img src="assets/logo.png" alt="DataPlace ETL" class="logo">
        <span class="app-name">DataPlace ETL</span>
      </div>
      <button mat-icon-button (click)="sidenav.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    
    <mat-nav-list class="nav-list">
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/clients" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>business</mat-icon>
        <span>Clientes</span>
      </a>
      <a mat-list-item routerLink="/audit" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>history</mat-icon>
        <span>Logs de Auditoria</span>
      </a>
      <a mat-list-item routerLink="/users" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>people</mat-icon>
        <span>Usuários</span>
      </a>
    </mat-nav-list>
    
    <div class="sidenav-footer">
      <a mat-list-item routerLink="/account" routerLinkActive="active-link" (click)="sidenav.close()">
        <mat-icon>account_circle</mat-icon>
        <span>Minha Conta</span>
      </a>
      <a mat-list-item (click)="logout(); sidenav.close()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Sair</span>
      </a>
    </div>
  </mat-sidenav>
  
  <!-- Conteúdo principal -->
  <mat-sidenav-content class="content-container">
    <!-- Barra superior (somente quando autenticado) -->
    <mat-toolbar color="primary" *ngIf="isAuthenticated$ | async" class="top-toolbar">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">DataPlace ETL Manager</span>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/account">
          <mat-icon>account_circle</mat-icon>
          <span>Minha Conta</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <mat-icon>exit_to_app</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>
    </mat-toolbar>
    
    <!-- Área de conteúdo principal (router-outlet) -->
    <div class="content-area" [ngClass]="{'with-toolbar': isAuthenticated$ | async}">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
