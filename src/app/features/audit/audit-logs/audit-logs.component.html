<div class="page-container">
  <div class="page-header">
    <h1>Audit Logs</h1>
  </div>

  <mat-card class="audit-logs-card">
    <mat-card-content>
      <div *ngIf="isLoading" class="loading-container">
        <mat-spinner></mat-spinner>
      </div>

      <div *ngIf="error" class="error-container">
        <mat-icon>error_outline</mat-icon>
        <p>Failed to load audit logs</p>
        <button mat-raised-button color="primary" (click)="loadAuditLogs()">Retry</button>
      </div>

      <div *ngIf="!isLoading && !error" class="table-container">
        <div *ngIf="dataSource.data.length === 0" class="empty-list">
          <mat-icon>receipt_long</mat-icon>
          <p>No audit logs found</p>
        </div>

        <table mat-table [dataSource]="dataSource" *ngIf="dataSource.data.length > 0" class="audit-logs-table">
          <!-- ID Column -->
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let log">{{ log.id }}</td>
          </ng-container>

          <!-- Level Column -->
          <ng-container matColumnDef="level">
            <th mat-header-cell *matHeaderCellDef>Level</th>
            <td mat-cell *matCellDef="let log">
              <span class="log-level" [ngClass]="getLevelClass(log.level)">{{ log.level }}</span>
            </td>
          </ng-container>

          <!-- Message Column -->
          <ng-container matColumnDef="message">
            <th mat-header-cell *matHeaderCellDef>Message</th>
            <td mat-cell *matCellDef="let log">
              <div class="message-container">
                <div class="log-message">{{ log.message }}</div>
                <div class="log-exception" *ngIf="log.exception">
                  <mat-icon class="exception-icon">error</mat-icon>
                  <span>{{ log.exception }}</span>
                </div>
              </div>
            </td>
          </ng-container>

          <!-- Timestamp Column -->
          <ng-container matColumnDef="timeStamp">
            <th mat-header-cell *matHeaderCellDef>Timestamp</th>
            <td mat-cell *matCellDef="let log">{{ log.timeStamp | date:'medium' }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator 
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="pageSizeOptions"
          [pageIndex]="pageIndex"
          (page)="onPageChange($event)"
          showFirstLastButtons
          *ngIf="dataSource.data.length > 0">
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<style>
  .page-container {
    padding: 24px;
  }

  .page-header {
    margin-bottom: 24px;
  }

  .page-header h1 {
    font-size: 24px;
    font-weight: 500;
    margin: 0;
  }

  .audit-logs-card {
    padding: 16px;
  }

  .loading-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 300px;
  }

  .error-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 300px;
    text-align: center;
  }

  .error-container mat-icon {
    font-size: 48px;
    height: 48px;
    width: 48px;
    color: #f44336;
    margin-bottom: 16px;
  }

  .empty-list {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 0;
    color: #757575;
  }

  .empty-list mat-icon {
    font-size: 48px;
    height: 48px;
    width: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }

  .table-container {
    overflow-x: auto;
  }

  .audit-logs-table {
    width: 100%;
  }

  .log-level {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }

  .error-level {
    background-color: #ffebee;
    color: #d32f2f;
  }

  .warning-level {
    background-color: #fff8e1;
    color: #ff8f00;
  }

  .info-level {
    background-color: #e3f2fd;
    color: #1976d2;
  }

  .message-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .log-message {
    white-space: normal;
    word-break: break-word;
  }

  .log-exception {
    display: flex;
    align-items: flex-start;
    color: #d32f2f;
    font-size: 12px;
    margin-top: 4px;
    background-color: #ffebee;
    padding: 4px 8px;
    border-radius: 4px;
  }

  .exception-icon {
    font-size: 16px;
    height: 16px;
    width: 16px;
    margin-right: 4px;
  }

  /* Make sure the timestamp column doesn't wrap */
  .mat-column-timeStamp {
    white-space: nowrap;
  }
</style>
